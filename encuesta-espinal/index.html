<meta name="description" content="Escoja los temas de las mesas de trabajo con Óscar Barreto. Presidentes de JAC de El Espinal.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --azul:#1F68AF; --marino:#154A80; --noche:#0F2F52; --naranja:#C25A1E;
    --celeste:#DCE9F6; --cielo:#75B6EA; --fondo:#F6F4EF; --texto:#1F2733; --gris:#6B7480;
    --verde:#1E8A4C; --blanco:#fff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:Lato,Calibri,Arial,sans-serif;background:var(--fondo);color:var(--texto);font-size:18px;line-height:1.35}
  .wrap{max-width:600px;margin:0 auto;padding:16px 16px 120px}
  header.top{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
  header.top img{width:52px;height:52px}
  header.top .t1{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--naranja);font-weight:900}
  header.top .t2{font-size:16px;font-weight:700;color:var(--marino)}
  .tabs{display:none;gap:8px;margin:0 0 14px}
  .tabs.on{display:flex}
  .tab{flex:1;border:2px solid var(--azul);background:#fff;color:var(--azul);border-radius:999px;padding:10px;font:inherit;font-weight:900;font-size:16px;cursor:pointer}
  .tab[aria-selected="true"]{background:var(--azul);color:#fff}
  .modo{display:none;background:#E7F3EC;color:var(--verde);border-radius:12px;padding:10px 14px;font-size:15px;margin-bottom:12px;font-weight:700}
  .modo.on{display:block}
  .card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 2px 10px rgba(15,47,82,.08);margin-bottom:14px}
  h1{font-size:30px;line-height:1.15;margin:0 0 10px;color:var(--noche);font-weight:900}
  h2{font-size:24px;line-height:1.2;margin:0 0 6px;color:var(--noche);font-weight:900}
  p{margin:0 0 12px}
  .big{font-size:21px}
  .muted{color:var(--gris);font-size:16px}
  .pasos{display:flex;gap:6px;margin:0 0 14px}
  .pasos span{flex:1;height:8px;border-radius:8px;background:#D9DEE5}
  .pasos span.on{background:var(--naranja)}
  .hero{background:var(--azul);color:#fff;border-radius:22px;padding:24px 20px;margin-bottom:14px;text-align:center}
  .hero img{width:110px;height:110px;background:#fff;border-radius:50%;padding:6px;margin-bottom:10px}
  .hero h1{color:#fff;font-size:32px}
  .hero p{font-size:20px}
  .tres{display:flex;gap:8px;justify-content:center;margin:14px 0 4px}
  .tres div{flex:1;background:rgba(255,255,255,.15);border-radius:14px;padding:10px 6px;font-size:15px;font-weight:700}
  .tres b{display:block;font-size:26px}
  label.lbl{display:block;font-weight:900;font-size:19px;margin:12px 0 6px}
  input[type=text],textarea{width:100%;font:inherit;font-size:19px;padding:14px;border:2px solid #C9D3DF;border-radius:14px;background:#fff;color:var(--texto)}
  input[type=text]:focus,textarea:focus{outline:none;border-color:var(--azul)}
  textarea{min-height:110px;resize:vertical}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{border:2px solid #C9D3DF;background:#fff;border-radius:999px;padding:11px 16px;font:inherit;font-size:17px;cursor:pointer;color:var(--texto)}
  .chip[aria-pressed="true"]{border-color:var(--azul);background:var(--celeste);color:var(--marino);font-weight:900}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .tema{position:relative;border:3px solid transparent;background:#fff;border-radius:18px;padding:14px 10px 12px;text-align:center;cursor:pointer;box-shadow:0 2px 8px rgba(15,47,82,.08);font:inherit;color:var(--texto)}
  .tema .emo{font-size:40px;display:block;line-height:1.1;margin-bottom:6px}
  .tema .nom{font-weight:900;font-size:18px;display:block;color:var(--noche)}
  .tema .fra{font-size:14px;color:var(--gris);display:block;margin-top:3px}
  .tema[aria-pressed="true"]{border-color:var(--naranja);background:#FFF4EC}
  .tema[aria-pressed="true"]::after{content:"✓";position:absolute;top:8px;right:10px;background:var(--naranja);color:#fff;width:28px;height:28px;border-radius:50%;font-weight:900;font-size:17px;line-height:28px}
  .tema:disabled{opacity:.45;cursor:not-allowed}
  .contador{position:sticky;top:0;z-index:5;background:var(--noche);color:#fff;border-radius:14px;padding:10px 14px;margin-bottom:12px;font-weight:900;font-size:18px;text-align:center}
  .opc{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:2px solid #C9D3DF;background:#fff;border-radius:14px;padding:14px;margin-bottom:8px;font:inherit;font-size:18px;cursor:pointer;color:var(--texto)}
  .opc .box{flex:0 0 30px;height:30px;border-radius:8px;border:2px solid #9AA6B4;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff}
  .opc[aria-pressed="true"]{border-color:var(--azul);background:var(--celeste);font-weight:700}
  .opc[aria-pressed="true"] .box{background:var(--azul);border-color:var(--azul)}
  .opc:disabled{opacity:.45;cursor:not-allowed}
  .temahead{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  .temahead .emo{font-size:44px}
  .check{display:flex;gap:12px;align-items:flex-start;font-size:16px;cursor:pointer;margin-top:14px}
  .check input{width:26px;height:26px;flex:0 0 26px;margin:0}
  .barra{position:fixed;left:0;right:0;bottom:0;background:rgba(246,244,239,.96);backdrop-filter:blur(4px);padding:12px 16px calc(12px + env(safe-area-inset-bottom));box-shadow:0 -2px 12px rgba(15,47,82,.1);z-index:10}
  .barra .in{max-width:600px;margin:0 auto;display:flex;gap:10px}
  .btn{flex:1;border:0;border-radius:16px;padding:17px 14px;font:inherit;font-size:20px;font-weight:900;cursor:pointer;text-align:center;text-decoration:none;display:inline-block}
  .btn.pri{background:var(--naranja);color:#fff}
  .btn.sec{background:#fff;color:var(--marino);border:2px solid var(--marino);flex:0 0 34%}
  .btn.wa{background:#1FA855;color:#fff;display:block;width:100%;margin:10px 0}
  .btn.azul{background:var(--azul);color:#fff;display:block;width:100%;margin:10px 0}
  .btn:disabled{background:#B9C2CC;cursor:not-allowed}
  .aviso{color:var(--naranja);font-weight:700;font-size:16px;min-height:20px;margin-top:8px}
  .resumen li{margin-bottom:8px}
  .resumen ul{padding-left:22px;margin:4px 0 0}
  .codigo{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--celeste);color:var(--noche);border-radius:12px;padding:12px;font-size:17px;word-break:break-all;text-align:center;font-weight:700}
  .ok{background:#E7F3EC;color:var(--verde);border-radius:14px;padding:14px;font-weight:900;font-size:19px;margin-bottom:12px}
  .hidden{display:none!important}
  /* resultados */
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
  .kpi{background:#fff;border-radius:16px;padding:14px;text-align:center;box-shadow:0 2px 8px rgba(15,47,82,.08)}
  .kpi b{display:block;font-size:34px;color:var(--azul);font-weight:900;line-height:1.05}
  .kpi span{font-size:14px;color:var(--gris)}
  .fila{margin-bottom:12px}
  .fila .lab{display:flex;justify-content:space-between;gap:8px;font-size:16px;margin-bottom:4px}
  .fila .lab b{color:var(--noche)}
  .track{height:16px;background:#EDF0F4;border-radius:8px;overflow:hidden}
  .fill{height:100%;background:var(--azul);border-radius:8px}
  .fila.top > .track > .fill{background:var(--naranja)}
  .subs{margin:6px 0 0 4px}
  .subs .fila .lab{font-size:15px}
  .subs .track{height:10px}
  .subs .fill{background:var(--cielo)}
  .mesa{border:2px solid var(--celeste);border-radius:14px;padding:12px 14px;margin-bottom:10px}
  .mesa h3{margin:0 0 4px;font-size:19px;color:var(--noche)}
  .mesa ol{margin:4px 0 0;padding-left:22px;font-size:16px}
  .lista{font-size:15px}
  .lista .v{border-bottom:1px solid #EDF0F4;padding:8px 0;display:flex;gap:10px;justify-content:space-between;align-items:flex-start}
  .lista .v small{color:var(--gris)}
  .mini{border:0;background:none;color:var(--naranja);font:inherit;font-size:14px;font-weight:700;cursor:pointer;padding:4px}
  .estado{font-size:15px;color:var(--gris);margin:6px 0}
  .dialog{position:fixed;inset:0;background:rgba(15,47,82,.5);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
  .dialog .card{max-width:420px;width:100%}
  @media (min-width:560px){ .grid{grid-template-columns:1fr 1fr 1fr} }
</style>
</head>

  <div class="card"><p class="big">⏱️ Es rapidito: <b>2 minutos</b>.</p><p class="muted">No hay respuestas buenas ni malas. Lo que más voten los presidentes serán las mesas de trabajo.</p></div>`;
  barra(`<button class="btn pri" id="go">Empezar ▶</button>`);
  $("#go").onclick=()=>{paso=1;render();};
}

function quien(){
  app.innerHTML = pasos(1)+`
  <div class="card">
    <h2>👤 ¿Quién es usted?</h2>
    <label class="lbl" for="barrio">¿De qué barrio o vereda es? *</label>
    <input type="text" id="barrio" maxlength="60" autocomplete="off" placeholder="Ejemplo: La Ceiba" value="${esc(v.barrio)}">
    <label class="lbl" for="nombre">Su nombre <span class="muted">(si quiere)</span></label>
    <input type="text" id="nombre" maxlength="60" autocomplete="off" placeholder="Ejemplo: María Pérez" value="${esc(v.nombre)}">
    <label class="lbl">Usted es:</label>
    <div class="chips">${ROLES.map(r=>`<button class="chip" data-rol="${r[0]}" aria-pressed="${v.rol===r[0]}">${r[1]}</button>`).join("")}</div>
    <div class="aviso" id="aviso"></div>
  </div>`;
  app.querySelectorAll("[data-rol]").forEach(b=>b.onclick=()=>{v.rol=b.dataset.rol;app.querySelectorAll("[data-rol]").forEach(x=>x.setAttribute("aria-pressed",x===b));});
  $("#barrio").oninput=e=>v.barrio=e.target.value; $("#nombre").oninput=e=>v.nombre=e.target.value;
  barra(`<button class="btn sec" id="back">◀ Atrás</button><button class="btn pri" id="next">Seguir ▶</button>`);
  $("#back").onclick=()=>{paso=0;render();};
  $("#next").onclick=()=>{ v.barrio=v.barrio.trim(); if(!v.barrio){$("#aviso").textContent="✋ Escriba su barrio o vereda, por favor.";$("#barrio").focus();return;} paso=2;render(); };
}

function temas(){
  const n=v.temas.length, lleno=n>=MAX_TEMAS;
  app.innerHTML = pasos(2)+`
  <h2>✋ Escoja los 3 temas más importantes para su barrio</h2>
  <p class="muted">Toque una tarjeta para escogerla. Tóquela otra vez para quitarla.</p>
  <div class="contador" id="cont">${n===0?"Lleva 0 de 3":n<3?`Lleva ${n} de 3 👍`:"¡Listo! Ya escogió sus 3 temas ✅"}</div>
  <div class="grid">${TEMAS.map(t=>{const on=v.temas.includes(t.id);return `<button class="tema" data-t="${t.id}" aria-pressed="${on}" ${!on&&lleno?"disabled":""}><span class="emo">${t.e}</span><span class="nom">${t.n}</span><span class="fra">${t.f}</span></button>`;}).join("")}</div>`;
  app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{const id=b.dataset.t;const i=v.temas.indexOf(id);if(i>=0){v.temas.splice(i,1);delete v.sub[id];}else if(v.temas.length<MAX_TEMAS){v.temas.push(id);}const y=window.scrollY;temas();window.scrollTo(0,y);});
  barra(`<button class="btn sec" id="back">◀ Atrás</button><button class="btn pri" id="next" ${n===0?"disabled":""}>Seguir ▶</button>`);
  $("#back").onclick=()=>{paso=1;render();};
  $("#next").onclick=()=>{ if(!v.temas.length) return; sub=0; paso=3; render(); };
}

function subtemas(){
  const tid=v.temas[sub], t=T[tid], sel=v.sub[tid]||[], lleno=sel.length>=MAX_SUB;
  app.innerHTML = pasos(3)+`
  <div class="card">
    <div class="temahead"><span class="emo">${t.e}</span><div><div class="muted">Tema ${sub+1} de ${v.temas.length}</div><h2>${t.n}</h2></div></div>
    <p class="big">¿Qué es lo <b>más importante</b>? Escoja <b>1 o 2</b>.</p>
    ${t.s.map(s=>{const on=sel.includes(s[0]);return `<button class="opc" data-s="${s[0]}" aria-pressed="${on}" ${!on&&lleno?"disabled":""}><span class="box">${on?"✓":""}</span><span>${s[1]}</span></button>`;}).join("")}
    <div class="aviso" id="aviso"></div>
  </div>`;
  app.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{const s=b.dataset.s;const arr=v.sub[tid]||(v.sub[tid]=[]);const i=arr.indexOf(s);if(i>=0)arr.splice(i,1);else if(arr.length<MAX_SUB)arr.push(s);subtemas();});
  barra(`<button class="btn sec" id="back">◀ Atrás</button><button class="btn pri" id="next">Seguir ▶</button>`);
  $("#back").onclick=()=>{ if(sub>0){sub--;subtemas();window.scrollTo(0,0);} else {paso=2;render();} };
  $("#next").onclick=()=>{ if(!(v.sub[tid]||[]).length){$("#aviso").textContent="✋ Escoja por lo menos una opción.";return;} if(sub<v.temas.length-1){sub++;subtemas();window.scrollTo(0,0);} else {paso=4;render();} };
}

function final(){
  app.innerHTML = pasos(4)+`
  <div class="card">
    <h2>💬 ¿Algo más que le quiera decir a Óscar?</h2>
    <p class="muted">Si quiere, escriba otro tema o una idea. Si no, siga.</p>
    <textarea id="com" maxlength="400" placeholder="Escriba aquí (si quiere)">${esc(v.comentario)}</textarea>
  </div>
  <div class="card resumen">
    <h2>👀 Mire su voto</h2>
    <p><b>Barrio o vereda:</b> ${esc(v.barrio)}</p>
    <ol>${v.temas.map(id=>`<li><b>${T[id].e} ${T[id].n}</b><ul>${(v.sub[id]||[]).map(s=>`<li>${esc(subName(id,s))}</li>`).join("")}</ul></li>`).join("")}</ol>
    <label class="check"><input type="checkbox" id="acepto" ${v.acepto?"checked":""}><span>Acepto que usen mis respuestas para organizar la reunión con Óscar Barreto (Ley 1581 de 2012).</span></label>
    <div class="aviso" id="aviso"></div>
  </div>`;
  $("#com").oninput=e=>v.comentario=e.target.value;
  $("#acepto").onchange=e=>v.acepto=e.target.checked;
  barra(`<button class="btn sec" id="back">◀ Atrás</button><button class="btn pri" id="next">${equipo?"Guardar voto ✅":"Terminar ✅"}</button>`);
  $("#back").onclick=()=>{ sub=v.temas.length-1; paso=3; render(); };
  $("#next").onclick=async()=>{
    if(!v.acepto){$("#aviso").textContent="✋ Marque la casilla para aceptar.";return;}
    v.comentario=v.comentario.trim(); guardado=null;
    if(equipo){
      $("#next").disabled=true; $("#next").textContent="Guardando…";
      try{ await db.collection("votos").doc("u-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6)).set(aDoc(v,"equipo")); guardado=true; }
      catch(e){ guardado=false; }
    } else if(SHEETS_URL){
      $("#next").disabled=true; $("#next").textContent="Enviando…";
      enviado = await enviarHoja(filaHoja(v));
    }
    paso=5; render();
  };
}

function codigo(x){ return "V1."+x.temas.map(id=>id+"-"+(x.sub[id]||[]).join("")).join(".")+"."+x.rol; }
function mensaje(x){
  const L=[ "🗳️ MI VOTO · Mesas con Óscar Barreto · El Espinal",
    "📍 Barrio/vereda: "+x.barrio ];
  if(x.nombre.trim()) L.push("👤 Nombre: "+x.nombre.trim());
  x.temas.forEach((id,i)=>L.push(NUMS[i]+" "+T[id].n+": "+(x.sub[id]||[]).map(s=>subName(id,s)).join("; ")));
  if(x.comentario) L.push("💬 Mensaje: "+x.comentario.replace(/\s+/g," "));
  L.push("Código: "+codigo(x));
  return L.join("\n");
}
function aDoc(x,origen){ return {barrio:x.barrio.trim(), nombre:x.nombre.trim(), rol:x.rol, temas:x.temas.slice(), sub:JSON.parse(JSON.stringify(x.sub)), comentario:x.comentario||"", origen, t:new Date().toISOString(), codigo:codigo(x)}; }

function filaHoja(x){
  const rol=Object.fromEntries(ROLES); const f={barrio:x.barrio.trim(), nombre:x.nombre.trim(), rol:rol[x.rol]||"", comentario:x.comentario||"", codigo:codigo(x), id:Date.now().toString(36)+Math.random().toString(36).slice(2,8)};
  [0,1,2].forEach(i=>{const id=x.temas[i]; f["tema"+(i+1)]=id?T[id].n:""; f["sub"+(i+1)]=id?(x.sub[id]||[]).map(s=>subName(id,s)).join("; "):"";});
  return f;
}
function cola(){ try{ return JSON.parse(localStorage.getItem("votosPendientes")||"[]"); }catch(e){ return []; } }
function guardarCola(c){ try{ localStorage.setItem("votosPendientes",JSON.stringify(c)); }catch(e){} }
async function postHoja(f){ await fetch(SHEETS_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(f)}); }
async function enviarHoja(f){
  try{ await postHoja(f); return true; }
  catch(e){ const c=cola(); c.push(f); guardarCola(c); return false; }
}
async function enviarPendientes(){
  if(!SHEETS_URL) return; const c=cola(); if(!c.length) return; const quedan=[];
  for(const f of c){ try{ await postHoja(f); }catch(e){ quedan.push(f); } }
  guardarCola(quedan);
}
window.addEventListener("online", enviarPendientes);

function gracias(){
  const msg=mensaje(v);
  const href="https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(msg);
  let top="";
  if(equipo){
    top = guardado ? `<div class="ok">✅ ¡Voto guardado! Gracias.</div>` : `<div class="aviso">⚠️ No se pudo guardar. Revise el internet y vuelva a intentar, o envíelo por WhatsApp.</div>`;
  }
  app.innerHTML = `
  <div class="hero"><h1>¡Gracias, líder! 🙌</h1><p>Su voz ayuda a escoger las mesas de trabajo con Óscar Barreto.</p></div>
  ${top}
  ${!equipo && SHEETS_URL ? (enviado ? `<div class="ok">✅ ¡Listo! Su voto quedó guardado.</div>` : `<div class="card"><h2>📶 No hay internet ahora</h2><p class="big">Tranquilo: su voto quedó guardado en este celular y se enviará solo cuando vuelva el internet.</p><p class="muted">Su código es:</p><div class="codigo">${esc(codigo(v))}</div></div>`) : ""}
  ${equipo && guardado || (!equipo && SHEETS_URL) ? "" : `
  <div class="card">
    <h2>📲 Último paso: envíe su voto</h2>
    <p class="big">Toque el botón verde. Se abre WhatsApp con su voto ya escrito. Solo toque <b>enviar</b> ➤.</p>
    <a class="btn wa" href="${href}" target="_blank" rel="noopener">Enviar por WhatsApp</a>
    <p class="muted">¿No tiene WhatsApp? Muéstrele esta pantalla a alguien del equipo. Su código es:</p>
    <div class="codigo">${esc(codigo(v))}</div>
  </div>`}
  <div class="card resumen"><h2>Su voto</h2><p><b>${esc(v.barrio)}</b></p><ol>${v.temas.map(id=>`<li><b>${T[id].e} ${T[id].n}</b>: ${(v.sub[id]||[]).map(s=>esc(subName(id,s))).join(", ")}</li>`).join("")}</ol></div>`;
  if(equipo && guardado===false){ app.querySelector(".hero").insertAdjacentHTML("afterend",`<button class="btn azul" id="retry">Intentar guardar otra vez</button>`); $("#retry").onclick=()=>{paso=4;render();}; }
  barra(`<button class="btn pri" id="otra">${equipo?"Siguiente persona ▶":"Volver al inicio"}</button>`);
  $("#otra").onclick=()=>{ v=nuevo(); paso=equipo?1:0; render(); };
}

/* ===== RESULTADOS (solo equipo) ===== */
let vista="votar", avPega="", avCop="", pegaTxt="";
function setVista(x){ vista=x; $("#tabVotar").setAttribute("aria-selected",x==="votar"); $("#tabRes").setAttribute("aria-selected",x==="res");
  app.classList.toggle("hidden",x!=="votar"); $("#resultados").classList.toggle("hidden",x!=="res"); $("#modo").classList.toggle("on",equipo&&x==="votar");
  if(x==="res"){ barra(""); renderRes(); } else render(); }
$("#tabVotar").onclick=()=>setVista("votar"); $("#tabRes").onclick=()=>setVista("res");

function conteo(){
  const tc={}, sc={}, barrios={};
  TEMAS.forEach(t=>{tc[t.id]=0;sc[t.id]={};t.s.forEach(s=>sc[t.id][s[0]]=0);});
  votos.forEach(d=>{ (d.temas||[]).forEach(id=>{ if(tc[id]===undefined) return; tc[id]++; (d.sub?.[id]||[]).forEach(s=>{ if(sc[id][s]!==undefined) sc[id][s]++; }); });
    const b=(d.barrio||"Sin barrio").trim().toLowerCase(); barrios[b]=(barrios[b]||0)+1; });
  const orden=TEMAS.map(t=>t.id).sort((a,b)=>tc[b]-tc[a]);
  return {tc,sc,barrios,orden};
}
function renderRes(){
  const R=$("#resultados");
  const {tc,sc,barrios,orden}=conteo(); const N=votos.length; const max=Math.max(1,...Object.values(tc));
  const nb=Object.keys(barrios).length;
  const est = cargando ? `<div class="estado">Cargando votos…</div>` : errorDb ? `<div class="aviso">${esc(errorDb)}</div>` : "";
  R.innerHTML = `
  ${est}
  <div class="kpis"><div class="kpi"><b>${N}</b><span>votos</span></div><div class="kpi"><b>${nb}</b><span>barrios y veredas</span></div><div class="kpi"><b>${votos.filter(d=>d.origen==="whatsapp").length}</b><span>llegaron por WhatsApp</span></div></div>
  <div class="card"><h2>🏆 Mesas sugeridas</h2><p class="muted">Los 5 temas más votados, con lo más pedido en cada uno.</p>
   ${N? orden.slice(0,5).filter(id=>tc[id]>0).map((id,i)=>{const t=T[id];const ss=t.s.map(s=>[s[1],sc[id][s[0]]]).filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]).slice(0,3);
     return `<div class="mesa"><h3>Mesa ${i+1}: ${t.e} ${t.n} <span class="muted">(${tc[id]} ${tc[id]===1?"voto":"votos"} · ${Math.round(tc[id]*100/N)}%)</span></h3><ol>${ss.map(x=>`<li>${esc(x[0])} <span class="muted">(${x[1]})</span></li>`).join("")}</ol></div>`;}).join("") : `<p>Todavía no hay votos.</p>`}
  </div>
  <div class="card"><h2>📊 Todos los temas</h2><p class="muted">% = presidentes que escogieron ese tema.</p>
   ${orden.map((id,i)=>{const t=T[id];return `<div class="fila ${i<5&&tc[id]>0?'top':''}"><div class="lab"><b>${t.e} ${t.n}</b><span>${tc[id]} · ${N?Math.round(tc[id]*100/N):0}%</span></div><div class="track"><div class="fill" style="width:${tc[id]*100/max}%"></div></div>
     ${tc[id]?`<div class="subs">${t.s.map(s=>[s[1],sc[id][s[0]]]).sort((a,b)=>b[1]-a[1]).map(x=>`<div class="fila"><div class="lab"><span>${esc(x[0])}</span><span>${x[1]}</span></div><div class="track"><div class="fill" style="width:${x[1]*100/tc[id]}%"></div></div></div>`).join("")}</div>`:""}</div>`;}).join("")}
  </div>
  <div class="card"><h2>📥 Agregar votos de WhatsApp</h2>
   <p class="muted">Copie los mensajes que llegaron al WhatsApp (uno o muchos a la vez) y péguelos aquí. También sirve escribir solo el código que muestra la pantalla.</p>
   <textarea id="pega" placeholder="Pegue aquí los mensajes…">${esc(pegaTxt)}</textarea>
   <button class="btn azul" id="agregar">Agregar votos</button><div class="aviso" id="avPega">${esc(avPega)}</div>
  </div>
  <div class="card"><h2>📋 Llevar a Excel</h2><p class="muted">Copia una tabla con todos los votos. Péguela en Excel o Google Sheets.</p>
   <button class="btn azul" id="copiar">Copiar tabla de votos</button><div class="aviso" id="avCop">${esc(avCop)}</div></div>
  <div class="card"><h2>🗂️ Votos (${N})</h2><div class="lista">${votos.slice().sort((a,b)=>(b.t||"").localeCompare(a.t||"")).map(d=>`<div class="v"><div><b>${esc(d.barrio||"Sin barrio")}</b> ${d.nombre?"· "+esc(d.nombre):""}<br>${(d.temas||[]).map(id=>T[id]?T[id].e+" "+T[id].n:"").join(" · ")}${d.comentario?`<br><small>💬 ${esc(d.comentario)}</small>`:""}<br><small>${d.origen==="whatsapp"?"WhatsApp":"Equipo"} · ${d.t?new Date(d.t).toLocaleString("es-CO"):""}</small></div><button class="mini" data-del="${esc(d._id)}">Borrar</button></div>`).join("")||"<p>Todavía no hay votos.</p>"}</div></div>`;
  $("#agregar").onclick=agregarWA; $("#pega").oninput=e=>pegaTxt=e.target.value;
  $("#copiar").onclick=copiarTabla;
  R.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>confirmar("¿Borrar este voto?",async()=>{ try{await db.collection("votos").doc(b.dataset.del).delete();}catch(e){} }));
}
function confirmar(txt,fn){ $("#dlg").innerHTML=`<div class="dialog"><div class="card"><h2>${esc(txt)}</h2><p class="muted">Esto no se puede deshacer.</p><div style="display:flex;gap:10px"><button class="btn sec" id="no" style="flex:1">No</button><button class="btn pri" id="si">Sí, borrar</button></div></div></div>`;
  $("#no").onclick=()=>$("#dlg").innerHTML=""; $("#si").onclick=()=>{$("#dlg").innerHTML="";fn();}; }

function hash(s){ let h=5381; for(let i=0;i<s.length;i++) h=((h<<5)+h+s.charCodeAt(i))>>>0; return h.toString(36); }
function parseCodigo(c){
  const m=c.match(/^V1\.(.+)\.([pdv])$/); if(!m) return null;
  const temas=[], sub={};
  for(const part of m[1].split(".")){ const [id,ss]=part.split("-"); if(!T[id]||temas.includes(id)||temas.length>=MAX_TEMAS) continue; temas.push(id); sub[id]=[...(ss||"")].filter(s=>T[id].s.some(x=>x[0]===s)).slice(0,MAX_SUB); }
  return temas.length? {temas,sub,rol:m[2]} : null;
}
async function agregarWA(){
  const txt=$("#pega").value;
  const items=[]; let cur=null;
  const cerrar=()=>{ if(!cur) return; const cm=cur.lines.join("\n").match(/V1\.[a-z0-9.\-]+/); if(cm){ const c=cm[0].replace(/\.$/,""); const p=parseCodigo(c); if(p){ const b=cur.lines.join("\n"); const g=(re)=>{const m=b.match(re);return m?m[1].trim():"";};
      items.push({key:"w-"+hash(b.replace(/\s+/g," ").trim()), d:{barrio:g(/Barrio\/vereda:\s*(.+)/)||"Sin barrio", nombre:g(/Nombre:\s*(.+)/), rol:p.rol, temas:p.temas, sub:p.sub, comentario:g(/Mensaje:\s*(.+)/), origen:"whatsapp", t:new Date().toISOString(), codigo:c}}); } } cur=null; };
  for(const line of txt.split(/\r?\n/)){
    if(/MI VOTO/.test(line)){ cerrar(); cur={lines:[line.slice(line.indexOf("MI VOTO"))]}; continue; }
    if(cur){ cur.lines.push(line); if(/V1\.[a-z]/.test(line)) cerrar(); continue; }
    (line.match(/V1\.[a-z0-9.\-]+/g)||[]).forEach((c,i)=>{ c=c.replace(/\.$/,""); const p=parseCodigo(c); if(p) items.push({key:"c-"+hash(c+Date.now()+Math.random()), d:{barrio:"Sin barrio",nombre:"",rol:p.rol,temas:p.temas,sub:p.sub,comentario:"",origen:"codigo",t:new Date().toISOString(),codigo:c}}); });
  }
  cerrar();
  if(!items.length){ avPega="No encontré votos en el texto. Revise que el mensaje tenga la línea “Código: V1…”."; $("#avPega").textContent=avPega; return; }
  const ya=new Set(votos.map(d=>d._id)); let nuevos=0, rep=0, fallo=0;
  $("#agregar").disabled=true;
  for(const it of items){ if(ya.has(it.key)){rep++;continue;} try{ await db.collection("votos").doc(it.key).set(it.d); nuevos++; ya.add(it.key);}catch(e){fallo++;} }
  avPega=`Listo: ${nuevos} ${nuevos===1?"voto nuevo":"votos nuevos"}${rep?`, ${rep} ya ${rep===1?"estaba":"estaban"}`:""}${fallo?`, ${fallo} no se pudieron guardar`:""}.`;
  pegaTxt = nuevos && !fallo ? "" : txt;
  renderRes();
}
async function copiarTabla(){
  const H=["Fecha","Barrio/vereda","Nombre","Rol","Origen","Tema 1","Subtemas 1","Tema 2","Subtemas 2","Tema 3","Subtemas 3","Comentario"];
  const rol=Object.fromEntries(ROLES);
  const rows=votos.map(d=>{const r=[d.t||"",d.barrio||"",d.nombre||"",rol[d.rol]||"",d.origen||""];for(let i=0;i<3;i++){const id=(d.temas||[])[i];r.push(id&&T[id]?T[id].n:"");r.push(id?(d.sub?.[id]||[]).map(s=>subName(id,s)).join("; "):"");}r.push(d.comentario||"");return r.map(x=>String(x).replace(/[\t\n]/g," ")).join("\t");});
  try{ await navigator.clipboard.writeText([H.join("\t"),...rows].join("\n")); avCop="✅ Copiada. Péguela en Excel."; $("#avCop").textContent=avCop; }
  catch(e){ avCop="No se pudo copiar en este navegador."; $("#avCop").textContent=avCop; }
}

/* ===== ARRANQUE ===== */
render();
enviarPendientes();
</script>
